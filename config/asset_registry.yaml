assets:
  # 3-Room Industrial Scenario Assets
  M-05:
    name: "Drive Motor M-05"
    type: "MOTOR"
    room: "ROOM-MOTOR-01"
    description: "Primary 75kW electric drive motor powering Line 1 production shaft."

  LINE-1:
    name: "Production Line 1"
    type: "PRODUCTION_LINE"
    room: "ROOM-CTRL-01"
    description: "Main automated manufacturing line 1."

  LINE-2:
    name: "Production Line 2"
    type: "PRODUCTION_LINE"
    room: "ROOM-CTRL-01"
    description: "Secondary automated manufacturing line 2 (Backup / Secondary)."

  PCS-LINE1:
    name: "Line 1 PLC Controller"
    type: "PLC"
    room: "ROOM-CTRL-01"
    controls: "LINE-1"
    description: "PLC panel governing Line 1 power and operational status."

  PCS-LINE2:
    name: "Line 2 PLC Controller"
    type: "PLC"
    room: "ROOM-CTRL-01"
    controls: "LINE-2"
    description: "PLC panel governing Line 2 power and operational status."

  INV-WH-01:
    name: "Warehouse Inventory Management System"
    type: "INVENTORY"
    room: "ROOM-WH-01"
    description: "Automated warehouse spare parts storage cabinet."

  SP-BRG-M05:
    name: "Spare Bearing M-05"
    type: "SPARE_PART"
    room: "ROOM-WH-01"
    part_of: "INV-WH-01"
    description: "Replacement roller bearing assembly for Drive Motor M-05."

  # Legacy assets preserved for test suite backwards compatibility
  CV-01:
    name: "Conveyor Line 1"
    type: "CONVEYOR"
    room: "ROOM-PACK-01"
    description: "Primary material transport conveyor line."
  CV-M01:
    name: "Main Drive Motor"
    type: "MOTOR"
    room: "ROOM-PACK-01"
    part_of: "CV-01"
    description: "Primary electric motor driving conveyor head pulley."
  CV-M02:
    name: "Tail Drive Motor & Bearing Assembly"
    type: "MOTOR"
    room: "ROOM-PACK-01"
    part_of: "CV-01"
    description: "Tail drive motor and roller bearing assembly."
  GUARD-CV01:
    name: "Conveyor Interlocked Guard"
    type: "GUARD"
    room: "ROOM-PACK-01"
    protects: "CV-01"
    description: "Physical interlocked protective cage covering tail drive assembly CV-M02."
  PCS-CV01:
    name: "PLC Control Cabinet CV-01"
    type: "PLC"
    room: "ROOM-PACK-01"
    controls: "CV-01"
    description: "Programmable logic controller panel governing conveyor CV-01 speed and power."
